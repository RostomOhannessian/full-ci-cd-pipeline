openapi: 3.1.0
info:
  title: Product Catalog API
  version: 1.0.0
  summary: The version 1 contract of the product catalog HTTP API.
  description: |
    This document is the source of truth for the HTTP API of the Secure Product Catalog Platform. It is authored first, and the running API must
    conform to it (ADR-0017). The sections below summarize the rules that every operation follows. The API style guide and the error catalog
    in the repository documentation explain each rule and each error type.

    **Authentication.** Every operation needs a bearer token from the catalog realm, with the scope that the operation names. The scopes are
    `catalog.read` for reads, `catalog.write` for creating and changing products, and `catalog.admin` for discontinuing products and for every
    category write.

    **Versioning.** The version is a segment of the path (`/api/v1`). Every response carries `api-supported-versions`. When a version is
    deprecated, its responses also carry `api-deprecated-versions`, `Deprecation` (RFC 9745), and `Sunset` (RFC 8594).

    **Conditional requests.** A single resource has a strong `ETag`. A `GET` with a matching `If-None-Match` returns 304. A `PUT` and a discontinue
    action require `If-Match`: a missing header returns 428, and a stale one returns 412.

    **Idempotent creates.** Every `POST` that creates a resource requires an `Idempotency-Key` header. The same key with the same body replays the
    first response. The same key with a different body returns 422, and the same key while the first request still runs returns 409.

    **Pagination.** Collections use opaque keyset cursors. A page carries `nextCursor` in the body and a `Link` header with `rel="next"`.

    **Errors.** Every error is `application/problem+json` (RFC 9457) with a `type` that names an entry of the error catalog, and a `traceId`.
    Validation errors list the messages for each field. The API rejects an unknown JSON property with a 400.
