# Offline link checking for the repository's Markdown.
# It verifies relative links, file references, and heading anchors. It makes no network requests.
# External links are checked nightly with lychee-external.toml, which sets offline to false.
offline = true
include_fragments = "full"

no_progress = true
# Also read Markdown under dot-directories such as .github/skills and .github/instructions.
hidden = true

# Templates contain {{placeholders}} instead of real link targets. The Git directory holds no documentation, and the DocFX site and its cache
# are build output that a local documentation build leaves in the working tree.
exclude_path = ['^docs/templates/', '^\.git/', '^_site/', '^\.docfx/']
