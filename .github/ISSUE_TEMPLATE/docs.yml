name: Documentation problem
description: A page is wrong, unclear, missing, or out of date, or a documented command does not work.
title: "docs: "
labels: ["documentation", "triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Path or URL of the page.
      placeholder: docs/tutorials/00-start-here.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - A command or example does not work
        - The explanation is unclear or confusing
        - Information is missing
        - Information is out of date or incorrect
        - A link is broken
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you tried, what you saw, and what you expected. Include the exact command and its output when relevant.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Your background with this topic
      description: Helps us pitch the fix at the right level. The documentation assumes you know the language syntax but not the tool.
      options:
        - New to this tool
        - Some experience
        - Experienced
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional. A pull request is welcome after the v1.0 release.
