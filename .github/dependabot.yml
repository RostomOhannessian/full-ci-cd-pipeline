version: 2

# Dependabot keeps pinned versions current. Pins are full commit SHAs (actions) and tag-plus-digest pairs (images),
# so every update arrives as a reviewable pull request. Security updates ignore the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /tools/lint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  # NuGet packages. Versions live in Directory.Packages.props. Dependabot may leave a downstream packages.lock.json stale when
  # a package flows through a project reference (dependabot-core issue 13950), so a failed locked restore on a Dependabot pull
  # request means: run "dotnet restore --force-evaluate" and commit the lock files (ADR-0020).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - nuget
    groups:
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
          - "TngTech.*"
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch

  # The Dev Container (WP1.4): the base image in its Dockerfile, its features and their lock file (the devcontainers entry below), and the API-only
  # stack in compose.yaml (the docker-compose entry at the end). Dependabot reads this file from the default branch, so these entries take effect when the
  # phase merges.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  # The Dockerfile for the product image arrives in Phase 2. Until it exists, Dependabot reports that it found no manifest for this entry.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - devcontainers

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
