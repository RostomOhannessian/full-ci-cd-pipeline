name: devcontainer

# Proves that a fresh Dev Container completes the quick start (plan sections 10.1 and 12). It builds the Dev Container from .devcontainer, runs the
# post-create command (dev bootstrap and dev doctor), then runs doctor, the build, the unit tests, and Lab 1 end to end: the API-only stack starts,
# and SQL Server, Valkey, Keycloak, and the telemetry stack answer as the plan describes. The same commands work on any machine with the Dev Container,
# and ADR-0025 records the design.
#
# It runs when the Dev Container or what it runs changes, every week, and by hand. It is not a required check yet: adding it to the rulesets is a
# settings change that the maintainer decides (WP1.4 notes). The release gate arrives with the release workflow in Phase 2.

on:
  pull_request:
    branches: [master, "phase/**"]
    paths:
      - ".devcontainer/**"
      - "scripts/**"
      - "docs/labs/scripts/**"
      - "compose.yaml"
      - ".env.example"
      - "identity/**"
      - "dev"
      - "dev.cmd"
      - "tools/versions.yaml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - "scripts/**"
      - "docs/labs/scripts/**"
      - "compose.yaml"
      - ".env.example"
      - "identity/**"
      - "dev"
      - "dev.cmd"
      - "tools/versions.yaml"
      - ".config/dotnet-tools.json"
      - "global.json"
      - ".github/workflows/devcontainer.yml"
  # Weekly, off the hour. Scheduled workflows run only on the default branch.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# No permissions by default. The job asks only for what it needs.
permissions: {}

concurrency:
  group: devcontainer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Dev Container onboarding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action builds the image from .devcontainer, starts the container, runs the lifecycle commands, and then runs the command below in it.
      # Nothing is pushed, and the job has no token that could push.
      - name: Run the onboarding in a fresh Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -euo pipefail
            # <onboarding>
            sh ./dev doctor
            sh ./dev build
            sh ./dev test unit
            sh ./dev lab 1 setup
            sh ./dev lab 1 run
            sh ./dev lab 1 cleanup
            # </onboarding>
