name: docs-quality

# Checks the Markdown, the links, and the Git history of every change.
# The commands are defined once in tools/lint/compose.yaml, so contributors run the same checks locally:
#   docker compose -f tools/lint/compose.yaml run --rm markdownlint
#   docker compose -f tools/lint/compose.yaml run --rm links
#   docker compose -f tools/lint/compose.yaml run --rm secrets

on:
  pull_request:
    branches: [master, "phase/**"]
  push:
    branches: [master]
  workflow_dispatch:

# No permissions by default. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull tool image
        run: |
          for attempt in 1 2 3; do
            docker compose -f tools/lint/compose.yaml pull markdownlint && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Lint Markdown
        run: docker compose -f tools/lint/compose.yaml run --rm markdownlint

  links:
    name: Internal links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull tool image
        run: |
          for attempt in 1 2 3; do
            docker compose -f tools/lint/compose.yaml pull links && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Check relative links and anchors
        run: docker compose -f tools/lint/compose.yaml run --rm links

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull tool image
        run: |
          for attempt in 1 2 3; do
            docker compose -f tools/lint/compose.yaml pull secrets && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Scan every commit for secrets
        run: docker compose -f tools/lint/compose.yaml run --rm secrets
