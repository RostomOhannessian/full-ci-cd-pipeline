resume:
  last-completed: "WP1.15 (AI usage statistics) is complete and merged through pull request 27 as squash commit 264bcee. The process fix, pull request 28, merged as 8ce7fa8, and the ledger slice of the October planning session merged through pull request 29 as f656cb8, and the author and committer emails of both are the noreply addresses (checked 2026-11-01). WP1.7, Application layer, is in progress as three stacked pull requests (ADR-0032). The first is open on wp/1.7-application-layer (pull request 30), the second is stacked on it on wp/1.7-application-pipeline (pull request 31), and the third is stacked on the second on wp/1.7-application-use-cases (pull request 32). The first delivers `Result<T>` with the seven typed errors, ProblemMapping (the one table from an error to an entry of the error catalog), PermissionPolicy (the one table from an access level to its scope and its roles, because a token needs both: R21), the handler interfaces, the ports, IIdGenerator with GuidV7IdGenerator (REQ-DOM-001 is verified), tests/Catalog.Application.Tests, the architecture rule that keeps ports small, the agreement tests against the catalog, the contract, and the realm, ADR-0032, and the Application layer reference page. The second delivers the six decorators in Catalog.CrossCutting, `CommandPipeline` and `QueryPipeline` (the only places that name them, so the order is plain code), the hook of IUnitOfWork that writes the idempotency record in the transaction of the command, FluentValidation 12.1.1 with its inventory and dependency catalog entries, tests of every decorator and of the order (REQ-APP-002 and REQ-APP-003 are verified), and the architecture rule that only a pipeline names the decorators. The third delivers the ten use cases with their views, read stores, keyset paging, and validators, IFeatureRegistry with AddCategories and AddProducts, four more architecture rules, the Application mutation baseline (96.92 percent, with the run argument application), and the statuses of the requirements (REQ-APP-001, REQ-ARC-005, and REQ-QUA-005 are verified). Test counts and coverage are in the pull requests (checked 2026-11-01). The machine runs .NET SDK 10.0.403, which global.json rolls forward to, and the Docker mutation service stays pinned to the 10.0.401 image until the maintainer decides otherwise."
  next-action: "Review and squash-merge the first pull request of WP1.7 (open-pull-requests) with an explicit subject and body (CONTRIBUTING.md, Squash commit message), then merge phase/1-api-core into the branch of the second pull request, change its base to phase/1-api-core, and squash-merge it, and do the same for the third. Then record the usage of the session with /ai-usage-recorder (the local session store held no rows for the WP1.7 session when this page was written, so no record could be made from facts), mark WP1.7 completed with /session-handoff, and start a fresh session for WP1.8, Persistence and outbox (Issue 10, size L). WP1.8 implements IProductRepository, ICategoryRepository, IUnitOfWork (with the BeforeCommit hook and the mapping of a concurrency conflict to PreconditionFailed and of a SKU index violation to a Conflict), IIdempotencyStore, IOutboxDispatcher, and the read stores, and WP1.9 implements ICatalogCache. Then start a fresh session for WP1.8, Persistence and outbox (Issue 10, size L). `dotnet run --project tools/Governance.Auditor -- session --moment end` prints the kickoff prompt. The owner has decisions waiting: close the Issues of the completed work packages (2 to 8, 24, and 25, with github-sync --apply only on approval); whether to make the ci, governance, and documentation jobs required checks in the rulesets; whether to add the two auditors to CODEOWNERS (risk R20); whether to correct the cache ACL patterns in plan section 8.5; whether to amend plan section 8.7, because Keycloak does not withhold a requested scope from a user without the mapped role (ADR-0026, risk R21, and ADR-0032 already requires both); the Testcontainers evidence for Linux expected from WP1.8; the two optional extensions in docs/plans/phases/optional-extensions.md; and a bug in work that is merged only into a phase branch, which ADR-0003 does not cover."
  open-pull-requests:
    - number: 30
      title: "feat(application): add results, typed errors, permissions, and ports"
      branch: "wp/1.7-application-layer"
    - number: 31
      title: "feat(crosscutting): add the decorator pipeline of commands and queries"
      branch: "wp/1.7-application-pipeline"
    - number: 32
      title: "feat(application): add the use cases and the application mutation baseline"
      branch: "wp/1.7-application-use-cases"
  environment-notes:
    - "Open the Dev Container, or install Git, Docker (running), and the .NET SDK 10.0.401 and follow docs/tutorials/native-setup.md. Run `./dev doctor` first (on Windows, `./dev` in PowerShell or `.\\dev` in cmd.exe), then `./dev bootstrap` to install the pinned script tools and create .env, and `./dev test scripts` for the Pester tests. The documentation gate runs through the docker compose commands (markdownlint, links, spelling, diagrams, secrets, secrets-worktree), the documentation auditor through `dotnet run --project tools/Documentation.Auditor -- audit`, the site build through `pwsh tools/ci/Invoke-DocFx.ps1 -Command build`, the .NET gate through the dotnet commands in AGENTS.md, and the governance checks through `dotnet run --project tools/Governance.Auditor -- <command>`."
    - "The local stack is `./dev compose up`, `./dev compose check`, and `./dev compose down`. It needs about 3 GB of Docker memory, binds 127.0.0.1 only, and keeps its secrets in the git-ignored .env, which never moves between machines. Delete _site and .docfx before the working-tree secret scan, because the site build output triggers false findings."
    - "The API contract is authored first, in contracts/openapi/catalog/v1/catalog.openapi.yaml. Change it, run `docker compose -f tools/lint/compose.yaml run --rm contract-lint`, run `dotnet test`, which includes tests/Catalog.Contract.Tests, and update docs/reference/api-contract.md and error-catalog.md in the same change. A new lint rule needs a break in tools/ci/ContractRules.Tests.ps1, and the script tests need Docker."
    - "A tool that you add to the repository needs a tool-inventory entry with a `detect` rule, and the documentation auditor fails when the files and the inventory disagree. Use the tool-doc-author skill, then run the audit."
    - "The domain model is in src/Catalog.Domain and follows docs/reference/domain-model.md. Change a rule, its tests, the page, and the contract in the same change, because tests/Catalog.Contract.Tests/DomainAgreementTests.cs fails when they disagree. Run `docker compose -f tools/lint/compose.yaml run --rm mutation` to see which changes to the model the tests miss. It runs Stryker.NET in a Linux container, because Stryker.NET cannot start on a Windows host that enforces Smart App Control, and it needs Docker and the network."
    - "`STATUS.md`, `AI-USAGE.md`, and `docs/testing/traceability.md` are generated. After you change `status.yaml`, run `status validate` and `status render`, after you change `ai-usage.yaml`, run `usage validate` and `usage render`, and after you change tests or evidence, run `trace`. Never edit the pages by hand."
    - "Use the repository-local noreply Git identity described in ADR-0006 and never set a personal email in this repository."
    - "Every session starts and ends with the session boundary check: `dotnet run --project tools/Governance.Auditor -- session --moment start|end` (add --context fresh|used|compacted and --task work-package|pull-request|bug-fix). It reads status.yaml and the local Git state, it does not fetch, and it prints the kickoff prompt for a fresh session. Its rules and prompts are in governance/policies/session-policy.yaml. Set resume.next-work-package when the maintainer chooses the next work package (docs/explanation/session-boundaries.md)."
    - "Every session also records what it cost, with the /ai-usage-recorder skill, before the end check: it reads the local session store, which only the machine that ran the session has, and appends records of its own session to docs/project/ai-usage.yaml. It never edits an older record, and `governance usage estimate` turns the completed work packages into a range for the planned ones (docs/explanation/ai-usage-statistics.md)."
    - "Keep the GitHub account setting Keep my email addresses private turned on. After every merge, check the author and committer emails of the merged range (see AGENTS.md)."
    - "The five spike branches (spike/1.a-pactnet-kestrel through spike/1.e-rotating-credentials) exist only on the machine that ran them and are never pushed. The spike reports carry the versions, image digests, commands, and key snippets needed to repeat them."
    - "Local clusters, Vault keys, and generated passwords belong to one machine and are never migrated. They do not exist yet."
