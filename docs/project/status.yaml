resume:
  last-completed: "WP1.1 is complete: the solution (six server projects and the architecture tests), the build and dependency-intake controls, and the ci workflow. 58 tests pass on Windows and in a Linux x86-64 container, the build has zero warnings, and the format, license, and coverage-threshold gates pass. The architecture rules, the license gate, the forbidden-package list, and the trusted-signer setting were each shown to fail on purpose. ADR-0018 is accepted and ADR-0020 is new. The work landed through pull request 18 into phase/1-api-core. WP1.0 (the risk spikes) landed earlier through pull request 17."
  next-action: "Start WP1.2, Governance core (Issue 4): create wp/1.2-governance-core from phase/1-api-core. The owner has three decisions waiting. First, whether to add the ci jobs (Build and test, Script tests, Format verification, License gate, Conventional Commit title) as required checks in the master and phase rulesets, which is a settings change that needs the owner's approval. Second, whether to correct the cache ACL patterns in plan section 8.5, as proposed in spike 1.b. Third, the Testcontainers evidence for Linux is now expected from WP1.8, because WP1.1 has no container tests."
  open-pull-requests: []
  environment-notes:
    - "Until the Dev Container arrives in WP1.4, Phase 1 work needs Git, Docker (running), the GitHub CLI, the .NET SDK 10.0.401, and PowerShell 7 with Pester 5 for the script tests. Run the documentation gate with the docker compose commands and the .NET gate with the dotnet commands in AGENTS.md."
    - "Use the repository-local noreply Git identity described in ADR-0006 and never set a personal email in this repository."
    - "Keep the GitHub account setting Keep my email addresses private turned on. After every merge, check the author and committer emails of the merged range (see AGENTS.md)."
    - "The five spike branches (spike/1.a-pactnet-kestrel through spike/1.e-rotating-credentials) exist only on the machine that ran them and are never pushed. The spike reports carry the versions, image digests, commands, and key snippets needed to repeat them."
    - "Local clusters, Vault keys, and generated passwords belong to one machine and are never migrated. They do not exist yet."
