resume:
  last-completed: "WP1.15 is complete: AI usage statistics. The ledger docs/project/ai-usage.yaml, with a JSON Schema that rejects any key that could hold text, records for each slice of a session (a window of one session that belongs to one phase or work package and one kind of activity) the AI units (AIU), calls, tokens, peak context, model time, user turns, compactions, and the model, effort, and agent of each row, plus the size of the change of each work package. `governance usage validate|render|estimate` checks the ledger against its schema and its consistency rules, writes the generated docs/project/AI-USAGE.md by phase, work package, model, and effort, and estimates a range of AIU for each work package that remains, by size, with its method and its caveats. The command never reads the session store: the /ai-usage-recorder skill does, with canonical queries, and /session-handoff runs it before the session boundary check. The history of Phase 0 (at phase level) and of WP1.0 to WP1.6 and WP1.14 is back-filled from the local session store, five of those eight work packages are windowed, and this session recorded its own usage. The governance workflow runs usage validate and usage render --check, so a completed work package without usage fails CI. AIU is not converted to money (ADR-0031: 1 AI credit is $0.01 USD and the store's prices match the published ones for the models used here, but plans and discounts decide the bill, checked 2026-10-12). REQ-AI-005 is verified. WP1.14 merged through pull request 26 as squash commit 18fd243, and WP1.15 merged through pull request 27 as squash commit 264bcee, both on phase/1-api-core, and the author and committer emails of both are the noreply addresses (checked 2026-10-12). A process fix, draft pull request 28 on fix/squash-commit-message-rule into phase/1-api-core, adds the squash commit message rule, because the squash of pull request 26 names only the session boundary check and omits plan amendment 2.1.0: CONTRIBUTING.md states the rule, and the pull request template, AGENTS.md, and the three kickoff prompts point to it. Commit 18fd243 is not rewritten, and WP1.13 checks the v0.1.0 release notes for the gap. WP1.0 to WP1.6 landed earlier through pull requests 17 to 23."
  next-action: "First, review and merge draft pull request 28, the squash commit message rule, and squash-merge it with an explicit subject and body (CONTRIBUTING.md, Squash commit message). Then start a fresh session for WP1.7, Application layer (Issue 9, size L). `dotnet run --project tools/Governance.Auditor -- session --moment end` prints the kickoff prompt, and the first thing the new session does is to run it with --moment start (plan section 5.8). The WP1.7 session records its own usage with /ai-usage-recorder before its handoff, and `dotnet run --project tools/Governance.Auditor -- usage estimate` shows what the work that remains might cost (a planning aid built on very few observations, so read its caveats first). WP1.7 builds the use cases, the ports, the IIdGenerator port with Guid.CreateVersion7 as its default, the validators, the decorator pipeline, and the mapping of a DomainError to the error catalog, on the domain model that WP1.6 delivered (REQ-DOM-001 stays in progress until the generator exists), and it adds the Application mutation baseline. The owner has decisions waiting. First, close the Issues of the completed work packages (2 to 8, 24, and 25), which github-sync shows as the only drift (run it as a dry run, and pass --apply only with the maintainer's approval). Second, whether to add the ci jobs (Build and test, Script tests, Format verification, License gate, Conventional Commit title, Contract lint), the Governance auditors job, the four documentation jobs (Spelling, Diagrams, Documentation site, Documentation auditor), and the Dev Container onboarding job as required checks in the master and phase rulesets, which is a settings change that needs the owner's approval. Third, whether to add tools/Governance.Auditor/ and tools/Documentation.Auditor/ to CODEOWNERS, because each auditor is built from the pull request it audits (risk R20). Fourth, whether to correct the cache ACL patterns in plan section 8.5, as proposed in spike 1.b. Fifth, whether to amend plan section 8.7, because Keycloak 26.8.0 does not withhold a requested scope from a user without the mapped role, so the API must authorize on the roles claim as well as the scope (ADR-0026, risk R21). Sixth, the Testcontainers evidence for Linux is expected from WP1.8, because no work package before it has container tests. Seventh, the two optional extensions after the launch gate, a nightly mutation report job and a web UI on top of the API, are written down in docs/plans/phases/optional-extensions.md, and each starts only when the maintainer says so. Eighth, a bug in work that is merged only into a phase branch has no rule in ADR-0003, which defines a hotfix against master, so the bug-fix prompt tells the session to ask (ADR-0030)."
  open-pull-requests:
    - number: 28
      title: "fix(process): require a descriptive squash commit message"
      branch: "fix/squash-commit-message-rule"
  environment-notes:
    - "Open the Dev Container, or install Git, Docker (running), and the .NET SDK 10.0.401 and follow docs/tutorials/native-setup.md. Run `./dev doctor` first (on Windows, `./dev` in PowerShell or `.\\dev` in cmd.exe), then `./dev bootstrap` to install the pinned script tools and create .env, and `./dev test scripts` for the Pester tests. The documentation gate runs through the docker compose commands (markdownlint, links, spelling, diagrams, secrets, secrets-worktree), the documentation auditor through `dotnet run --project tools/Documentation.Auditor -- audit`, the site build through `pwsh tools/ci/Invoke-DocFx.ps1 -Command build`, the .NET gate through the dotnet commands in AGENTS.md, and the governance checks through `dotnet run --project tools/Governance.Auditor -- <command>`."
    - "The local stack is `./dev compose up`, `./dev compose check`, and `./dev compose down`. It needs about 3 GB of Docker memory, binds 127.0.0.1 only, and keeps its secrets in the git-ignored .env, which never moves between machines. Delete _site and .docfx before the working-tree secret scan, because the site build output triggers false findings."
    - "The API contract is authored first, in contracts/openapi/catalog/v1/catalog.openapi.yaml. Change it, run `docker compose -f tools/lint/compose.yaml run --rm contract-lint`, run `dotnet test`, which includes tests/Catalog.Contract.Tests, and update docs/reference/api-contract.md and error-catalog.md in the same change. A new lint rule needs a break in tools/ci/ContractRules.Tests.ps1, and the script tests need Docker."
    - "A tool that you add to the repository needs a tool-inventory entry with a `detect` rule, and the documentation auditor fails when the files and the inventory disagree. Use the tool-doc-author skill, then run the audit."
    - "The domain model is in src/Catalog.Domain and follows docs/reference/domain-model.md. Change a rule, its tests, the page, and the contract in the same change, because tests/Catalog.Contract.Tests/DomainAgreementTests.cs fails when they disagree. Run `docker compose -f tools/lint/compose.yaml run --rm mutation` to see which changes to the model the tests miss. It runs Stryker.NET in a Linux container, because Stryker.NET cannot start on a Windows host that enforces Smart App Control, and it needs Docker and the network."
    - "`STATUS.md`, `AI-USAGE.md`, and `docs/testing/traceability.md` are generated. After you change `status.yaml`, run `status validate` and `status render`, after you change `ai-usage.yaml`, run `usage validate` and `usage render`, and after you change tests or evidence, run `trace`. Never edit the pages by hand."
    - "Use the repository-local noreply Git identity described in ADR-0006 and never set a personal email in this repository."
    - "Every session starts and ends with the session boundary check: `dotnet run --project tools/Governance.Auditor -- session --moment start|end` (add --context fresh|used|compacted and --task work-package|pull-request|bug-fix). It reads status.yaml and the local Git state, it does not fetch, and it prints the kickoff prompt for a fresh session. Its rules and prompts are in governance/policies/session-policy.yaml. Set resume.next-work-package when the maintainer chooses the next work package (docs/explanation/session-boundaries.md)."
    - "Every session also records what it cost, with the /ai-usage-recorder skill, before the end check: it reads the local session store, which only the machine that ran the session has, and appends records of its own session to docs/project/ai-usage.yaml. It never edits an older record, and `governance usage estimate` turns the completed work packages into a range for the planned ones (docs/explanation/ai-usage-statistics.md)."
    - "Keep the GitHub account setting Keep my email addresses private turned on. After every merge, check the author and committer emails of the merged range (see AGENTS.md)."
    - "The five spike branches (spike/1.a-pactnet-kestrel through spike/1.e-rotating-credentials) exist only on the machine that ran them and are never pushed. The spike reports carry the versions, image digests, commands, and key snippets needed to repeat them."
    - "Local clusters, Vault keys, and generated passwords belong to one machine and are never migrated. They do not exist yet."
