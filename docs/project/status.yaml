resume:
  last-completed: "WP1.9 (Caching) is complete. It was delivered as two stacked pull requests that merged into phase/1-api-core as squash commits 3238823 and 51da256 (pull requests 43 and 44), and this status pull request closes it. The author and committer emails of both are the noreply addresses (checked 2026-11-03), and each passed the hosted checks that run on a pull request. The first delivers FusionCache 2.9.0 behind ICatalogCache as FusionCatalogCache in Catalog.CrossCutting (keys, tags, times to live, circuit breakers, a removal that throws CacheInvalidationIncompleteException when Valkey or the backplane did not confirm it, the metrics on the meter Catalog.Cache, and a source-generated JSON contract), the Valkey connection in Catalog.Infrastructure, tests against a real Valkey 8.1 container started from the digest of compose.yaml, three architecture rules that keep FusionCache in CrossCutting and the Valkey client in Infrastructure, the Valkey ACL of compose.yaml narrowed to the verified patterns, and ADR-0038. The second delivers CacheInvalidationPolicy (one table from each domain event to the tags that it makes stale), CacheInvalidationSubscriber (an idempotent outbox handler with a receipt), the dispatcher that gives the messages of a commit to the handlers in process before the outbox repeats them, the tests of two hosts over one SQL Server and one Valkey (a removal through the backplane, the outbox as the fallback when the immediate removal never happens or Valkey is down, the receipt, and a Valkey server that stops and returns), the consistency model, and ADR-0039. ADR-0016 is accepted, the last item of the confirmation of ADR-0012 is proven, FusionCache is adopted in the inventory, and REQ-CACHE-001 and REQ-ARC-003 are verified. REQ-CACHE-002 and REQ-CACHE-003 stay in progress for the end-to-end and performance proofs of WP4.4, the alerts of WP1.11, and the readiness check of WP1.10. In the Linux SDK image with coverage, and on Windows, 1,843 tests passed, and the solution covers 98.22 percent of its lines (checked 2026-11-03). The two pull requests changed 85 files with 5,657 additions and 111 deletions. Plan section 8.5 differs from what a real Valkey needs, and the plan is not amended: the ACL names `~v2:catalog:{env}:*` and `&catalog:{env}.Backplane:v2` and 14 commands, the removal of L2 is a marker and not a delete, and the backplane gauge opens only when a publish fails (ADR-0038, ADR-0039). Before it, WP1.8 (Persistence and outbox) is complete. It was delivered as three stacked pull requests that merged into phase/1-api-core as squash commits 706d519, 3994f61, and 923f496 (pull requests 38, 39, and 40). Three pull requests that it needed merged before them: the cloud fallback of the usage recorder (pull request 35, 90ed76b), the usage record of WP1.7 (pull request 36, ffbb6c6), and the license exception for the native Windows runtime of SqlClient (pull request 37, 901311e, the amendment of 2026-11-03 to ADR-0004). The author and committer emails of all six are the noreply addresses (checked 2026-11-03), and each passed the 14 hosted checks that run on a pull request. The first delivers the EF Core write model and read model in Catalog.Infrastructure, the repositories, EfUnitOfWork, the initial migration, the persistence tests against a real SQL Server 2022 container with assembly fixtures, the linux-tests service (ADR-0034, with the Docker socket as a reviewed exception for a developer machine), and ADR-0033. The second delivers the outbox interceptor and processor (ADR-0035), the idempotency store (ADR-0036), and a second migration that makes the idempotency keys case sensitive. The third delivers ICredentialSource with a static source and a rotating-file source, the connection interceptor, and pool clearing (ADR-0037). ADR-0012 is accepted. Each migration is in its own commit, for the review of CODEOWNERS. The three pull requests changed 115 files with 12,276 additions and 80 deletions. In the Linux SDK image with coverage, 1,648 tests passed on the last branch before the license exception (checked 2026-11-02). The usage of its session is in the ledger as one derived slice of 474 calls and 2,869.925 AIU, a floor, because the cloud store ends before the end of the session. The Infrastructure has no mutation baseline and no coverage threshold yet, and a threshold needs an ADR. Before it, WP1.7 (Application layer) is complete. It was delivered as three stacked pull requests (ADR-0032) that merged into phase/1-api-core as squash commits 1492378, eccafb7, and d7cb250 (pull requests 30, 31, and 32), and its status pull request 33 merged as 94b61bb. The author and committer emails of all four are the noreply addresses (checked 2026-11-01). The first delivers `Result<T>` with the seven typed errors, ProblemMapping (the one table from an error to an entry of the error catalog), PermissionPolicy (the one table from an access level to its scope and its roles, because a token needs both: R21), the handler interfaces, the ports, IIdGenerator with GuidV7IdGenerator (REQ-DOM-001 is verified), tests/Catalog.Application.Tests, the architecture rule that keeps ports small, the agreement tests against the catalog, the contract, and the realm, ADR-0032, and the Application layer reference page. The second delivers the six decorators in Catalog.CrossCutting, `CommandPipeline` and `QueryPipeline` (the only places that name them, so the order is plain code), the hook of IUnitOfWork that writes the idempotency record in the transaction of the command, FluentValidation 12.1.1 with its inventory and dependency catalog entries, tests of every decorator and of the order (REQ-APP-002 and REQ-APP-003 are verified), and the architecture rule that only a pipeline names the decorators. The third delivers the ten use cases with their views, read stores, keyset paging, and validators, IFeatureRegistry with AddCategories and AddProducts, four more architecture rules, the Application mutation baseline (96.92 percent, with the run argument application), and the statuses of the requirements (REQ-APP-001, REQ-ARC-005, and REQ-QUA-005 are verified). Test counts and coverage: 1,393 tests passed on Windows and in the Linux SDK image with coverage, the Application covers 100 percent of its lines and 99.52 percent of its branches, and the solution covers 99.88 percent of its lines (checked 2026-11-01). With the cloud fallback, 1,421 tests pass on Windows and in the Linux SDK image with coverage (checked 2026-11-01). The three pull requests changed 98 files with 6,513 additions and 86 deletions. The usage of its session is in the ledger as one derived slice of 335 calls and 2,598.864 AIU, read from the cloud store because the local store held no rows for the session (the local store has none after 2026-10-12). It is a floor, and the ledger marks it (AI-USAGE.md shows the derived share). The cloud fallback of /ai-usage-recorder, with derived usage in the ledger schema, the validator, the report, and the estimate, is the fix of ADR-0031 (update of 2026-11-01), and the record of WP1.7 is stacked on it. The cloud fallback merged as pull request 35 and the WP1.7 usage record as pull request 36. The machine runs .NET SDK 10.0.403, which global.json rolls forward to, and the Docker mutation service stays pinned to the 10.0.401 image until the maintainer decides otherwise."
  next-action: "Start WP1.10, HTTP API (Issue 12, size L), which depends on WP1.4, WP1.5, WP1.8, and WP1.9, all complete. Read the WP1.10 row of docs/plans/phases/phase-1-api-core.md and plan section 8.6, and the contract in contracts/openapi/catalog/v1/catalog.openapi.yaml. The Api is the composition root: it registers the persistence and the cache, and docs/reference/persistence.md and docs/reference/caching.md list the registrations, with tests/Catalog.Infrastructure.Tests/Support/TestComposition.cs and CacheHost.cs as the reference. The dispatcher is scoped now, because it takes the write context of its scope, and CacheInvalidationSubscriber over ICatalogCache must be registered as a singleton IOutboxMessageHandler, which both the processor and the dispatcher take. The readiness check that stays green while the cache degrades is WP1.10 too, and the alerts on the gauges of the cache and the outbox are WP1.11. `dotnet run --project tools/Governance.Auditor -- session --moment end` prints the kickoff prompt. Usage is owed: the ledger has no record of the session that built the license exception (2fc37633-f637-48c0-be08-0c68980b5175) or of the coordinating session, because neither session store had events for them, and the cloud store has no event of any session after 2026-11-02T07:02Z, except the session of WP1.9 (checked 2026-11-03). The record of the session of WP1.9 (f784fcdc-a0b2-4d1f-92cc-0865e3d5d9ea) holds the calls until 2026-11-03T15:26:19Z, because its events stop in the cloud store at the first question to the maintainer, so the later calls (pull request 44, the close-out, and the handoff) are owed as a later slice once they reach a store. The records of the sessions 6f91000a-906b-432f-abfd-b4117e12bf7d and a41f0966-9319-41f7-8efd-468f1f7ca66a also stop before later calls that the cloud store now holds. A session appends a later slice of itself once its events are in a store, and never edits an older record. The earlier owner decisions are still open: close the Issues of the completed work packages (2 to 8, 24, and 25, with github-sync --apply only on approval), decide whether to make the ci, governance, and documentation jobs required checks in the rulesets, whether to correct the cache ACL patterns and the L2 removal wording in plan section 8.5 (ADR-0038 records what a real Valkey needs: `~v2:catalog:{env}:*` and `&catalog:{env}.Backplane:v2`, and a plan amendment is its own `docs(plan):` pull request), whether to add the two auditors to CODEOWNERS (risk R20), and whether to amend plan section 8.7 (ADR-0026, risk R21)."
  open-pull-requests: []
  environment-notes:
    - "Open the Dev Container, or install Git, Docker (running), and the .NET SDK 10.0.401 and follow docs/tutorials/native-setup.md. Run `./dev doctor` first (on Windows, `./dev` in PowerShell or `.\\dev` in cmd.exe), then `./dev bootstrap` to install the pinned script tools and create .env, and `./dev test scripts` for the Pester tests. The documentation gate runs through the docker compose commands (markdownlint, links, spelling, diagrams, secrets, secrets-worktree), the documentation auditor through `dotnet run --project tools/Documentation.Auditor -- audit`, the site build through `pwsh tools/ci/Invoke-DocFx.ps1 -Command build`, the .NET gate through the dotnet commands in AGENTS.md, and the governance checks through `dotnet run --project tools/Governance.Auditor -- <command>`."
    - "The local stack is `./dev compose up`, `./dev compose check`, and `./dev compose down`. It needs about 3 GB of Docker memory, binds 127.0.0.1 only, and keeps its secrets in the git-ignored .env, which never moves between machines. Delete _site and .docfx before the working-tree secret scan, because the site build output triggers false findings."
    - "The API contract is authored first, in contracts/openapi/catalog/v1/catalog.openapi.yaml. Change it, run `docker compose -f tools/lint/compose.yaml run --rm contract-lint`, run `dotnet test`, which includes tests/Catalog.Contract.Tests, and update docs/reference/api-contract.md and error-catalog.md in the same change. A new lint rule needs a break in tools/ci/ContractRules.Tests.ps1, and the script tests need Docker."
    - "A tool that you add to the repository needs a tool-inventory entry with a `detect` rule, and the documentation auditor fails when the files and the inventory disagree. Use the tool-doc-author skill, then run the audit."
    - "The domain model is in src/Catalog.Domain and follows docs/reference/domain-model.md. Change a rule, its tests, the page, and the contract in the same change, because tests/Catalog.Contract.Tests/DomainAgreementTests.cs fails when they disagree. Run `docker compose -f tools/lint/compose.yaml run --rm mutation` to see which changes to the model the tests miss. It runs Stryker.NET in a Linux container, because Stryker.NET cannot start on a Windows host that enforces Smart App Control, and it needs Docker and the network."
    - "`STATUS.md`, `AI-USAGE.md`, and `docs/testing/traceability.md` are generated. After you change `status.yaml`, run `status validate` and `status render`, after you change `ai-usage.yaml`, run `usage validate` and `usage render`, and after you change tests or evidence, run `trace`. Never edit the pages by hand."
    - "Use the repository-local noreply Git identity described in ADR-0006 and never set a personal email in this repository."
    - "Every session starts and ends with the session boundary check: `dotnet run --project tools/Governance.Auditor -- session --moment start|end` (add --context fresh|used|compacted and --task work-package|pull-request|bug-fix). It reads status.yaml and the local Git state, it does not fetch, and it prints the kickoff prompt for a fresh session. Its rules and prompts are in governance/policies/session-policy.yaml. Set resume.next-work-package when the maintainer chooses the next work package (docs/explanation/session-boundaries.md)."
    - "Every session also records what it cost, with the /ai-usage-recorder skill, before the end check: it reads the local session store, which only the machine that ran the session has, or the cloud store when the local one has no rows for the session (a derived record, which is a floor), and appends records of its own session to docs/project/ai-usage.yaml. It never edits an older record, and `governance usage estimate` turns the completed work packages into a range for the planned ones (docs/explanation/ai-usage-statistics.md)."
    - "The persistence suites start SQL Server in Docker. `docker compose -f tools/lint/compose.yaml run --rm linux-tests` runs the whole suite with coverage in the pinned Linux SDK image, with the Docker socket mounted as a reviewed exception for a developer machine (ADR-0034). Use it when Smart App Control blocks a freshly built test assembly on Windows (error 0x800711C7, which happened to the Infrastructure tests on 2026-11-02), and say in the evidence which host ran what. The Windows auditor binaries can be run from the Release build with `dotnet tools/<Tool>/bin/Release/net10.0/<name>.dll <command>` when the launcher executable is blocked."
    - "Keep the GitHub account setting Keep my email addresses private turned on. After every merge, check the author and committer emails of the merged range (see AGENTS.md)."
    - "The five spike branches (spike/1.a-pactnet-kestrel through spike/1.e-rotating-credentials) exist only on the machine that ran them and are never pushed. The spike reports carry the versions, image digests, commands, and key snippets needed to repeat them."
    - "Local clusters, Vault keys, and generated passwords belong to one machine and are never migrated. They do not exist yet."
