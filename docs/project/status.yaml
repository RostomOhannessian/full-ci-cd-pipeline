resume:
  last-completed: "WP1.5 is complete: the contract v1 design. The authored OpenAPI 3.1.0 contract (contracts/openapi/catalog/v1/catalog.openapi.yaml) defines the 10 operations on categories and products, Problem Details for 17 error types, strong ETags with If-Match and If-None-Match, an Idempotency-Key on every create, opaque keyset cursors, the version and deprecation headers, the three OAuth scopes, and a valid example for every body (ADR-0028). Spectral 6.17.0 lints it from a digest-pinned container with 15 catalog rules (ADR-0027), a Contract lint job runs it in ci.yml, and a Pester test breaks the contract once for each rule and expects the rule to fire. 86 contract tests read the contract with Microsoft.OpenApi 2.12.2 and check it against the permission matrix, the error catalog, and the style guide. tools/ci/Test-ContractConformance.ps1 compares a served document with the contract through oasdiff 1.33.0, and its tests show wording changes passing and seven kinds of structural change failing. The API contract page, the API style guide, the error catalog, three tool pages, and ADR-0017 (accepted), ADR-0027, and ADR-0028 are new. 775 .NET tests and 337 Pester tests pass, the build has zero warnings, and the format, license, coverage-threshold, and governance gates pass. Each new gate was shown to fail on a planted defect. Pull request 22 stacks on pull request 21 (WP1.4), which is still an open draft, so WP1.5 merges after it and its base moves to phase/1-api-core. WP1.0 to WP1.3 landed earlier through pull requests 17 to 20."
  next-action: "Merge pull request 21 (WP1.4) into phase/1-api-core, then retarget pull request 22 (WP1.5) to phase/1-api-core and rebase it, because it stacks on the WP1.4 branch. Then start WP1.6, Domain model (Issue 8): create wp/1.6-domain-model from phase/1-api-core. It builds the aggregates, value objects, IDs, events, and invariants of plan section 8.3 and the unit and property tests, and it must follow the contract: the field names, bounds, and money format are in ADR-0028 and the contract, and WP1.6 owns the final currency list. The owner has decisions waiting. First, close Issues 2, 3, and 4, which github-sync shows as the only drift (run it as a dry run, and pass --apply only with the maintainer's approval). Second, whether to add the ci jobs (Build and test, Script tests, Format verification, License gate, Conventional Commit title, Contract lint), the Governance auditors job, the four documentation jobs (Spelling, Diagrams, Documentation site, Documentation auditor), and the Dev Container onboarding job as required checks in the master and phase rulesets, which is a settings change that needs the owner's approval. Third, whether to add tools/Governance.Auditor/ and tools/Documentation.Auditor/ to CODEOWNERS, because each auditor is built from the pull request it audits (risk R20). Fourth, whether to correct the cache ACL patterns in plan section 8.5, as proposed in spike 1.b. Fifth, whether to amend plan section 8.7, because Keycloak 26.8.0 does not withhold a requested scope from a user without the mapped role, so the API must authorize on the roles claim as well as the scope (ADR-0026, risk R21). Sixth, the Testcontainers evidence for Linux is expected from WP1.8, because no work package before it has container tests."
  open-pull-requests:
    - number: 21
      title: "feat(dev): add the developer environment and local stack"
      branch: "wp/1.4-developer-environment"
    - number: 22
      title: "feat(contracts): add the v1 API contract and its checks"
      branch: "wp/1.5-contract-v1-design"
  environment-notes:
    - "Open the Dev Container, or install Git, Docker (running), and the .NET SDK 10.0.401 and follow docs/tutorials/native-setup.md. Run `./dev doctor` first (on Windows, `./dev` in PowerShell or `.\\dev` in cmd.exe), then `./dev bootstrap` to install the pinned script tools and create .env, and `./dev test scripts` for the Pester tests. The documentation gate runs through the docker compose commands (markdownlint, links, spelling, diagrams, secrets, secrets-worktree), the documentation auditor through `dotnet run --project tools/Documentation.Auditor -- audit`, the site build through `pwsh tools/ci/Invoke-DocFx.ps1 -Command build`, the .NET gate through the dotnet commands in AGENTS.md, and the governance checks through `dotnet run --project tools/Governance.Auditor -- <command>`."
    - "The local stack is `./dev compose up`, `./dev compose check`, and `./dev compose down`. It needs about 3 GB of Docker memory, binds 127.0.0.1 only, and keeps its secrets in the git-ignored .env, which never moves between machines. Delete _site and .docfx before the working-tree secret scan, because the site build output triggers false findings."
    - "The API contract is authored first, in contracts/openapi/catalog/v1/catalog.openapi.yaml. Change it, run `docker compose -f tools/lint/compose.yaml run --rm contract-lint`, run `dotnet test`, which includes tests/Catalog.Contract.Tests, and update docs/reference/api-contract.md and error-catalog.md in the same change. A new lint rule needs a break in tools/ci/ContractRules.Tests.ps1, and the script tests need Docker."
    - "A tool that you add to the repository needs a tool-inventory entry with a `detect` rule, and the documentation auditor fails when the files and the inventory disagree. Use the tool-doc-author skill, then run the audit."
    - "`STATUS.md` and `docs/testing/traceability.md` are generated. After you change `status.yaml`, run `status validate` and `status render`, and after you change tests or evidence, run `trace`. Never edit the pages by hand."
    - "Use the repository-local noreply Git identity described in ADR-0006 and never set a personal email in this repository."
    - "Keep the GitHub account setting Keep my email addresses private turned on. After every merge, check the author and committer emails of the merged range (see AGENTS.md)."
    - "The five spike branches (spike/1.a-pactnet-kestrel through spike/1.e-rotating-credentials) exist only on the machine that ran them and are never pushed. The spike reports carry the versions, image digests, commands, and key snippets needed to repeat them."
    - "Local clusters, Vault keys, and generated passwords belong to one machine and are never migrated. They do not exist yet."
