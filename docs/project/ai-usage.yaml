# The ledger of what the AI-paired sessions of this project cost: AI units (AIU), calls, tokens, peak context, and model time, for each
# slice of a session. Plan section 5.8, WP1.15, and ADR-0031 say why. docs/explanation/ai-usage-statistics.md says how to read it.
#
# - The numbers come from the Copilot session store through the /ai-usage-recorder skill. `governance usage validate` checks this file,
#   and `governance usage render` writes AI-USAGE.md from it, so never edit that page by hand.
# - A slice is a window of one session that belongs to one phase or work package and one kind of activity. Every call is in one slice.
# - An older record is never edited. A new session adds its own records.
# - The ledger holds opaque session IDs and numbers only: no prompt text, no file paths, and no account names.
