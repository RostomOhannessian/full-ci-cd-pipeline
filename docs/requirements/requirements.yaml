requirements:
- id: REQ-ARC-001
  title: Layer references stay within Clean Architecture
  statement: The solution enforces the layer reference rules in section 8.1 so Domain references only the BCL, Application references only Domain, Contracts reference nothing, Infrastructure and CrossCutting reference only Application, Api is the only composition root, and Catalog.Client never references server projects.
  source: brief
  brief-rows:
  - 1
  delivered-by:
  - WP1.1
  - WP1.6
  - WP1.7
  - WP1.8
  - WP1.10
  verification:
  - architecture
  - docs
  evidence: ArchUnitNET layer report and project graph
  status: planned
- id: REQ-ARC-002
  title: Api is the only composition root
  statement: Only Catalog.Api may inject IServiceProvider or register dependency wiring, and no business logic may live in the composition root.
  source: plan
  delivered-by:
  - WP1.1
  - WP1.10
  verification:
  - architecture
  - manual
  evidence: composition-root review
  status: planned
- id: REQ-ARC-003
  title: Application ports are interface-segregated
  statement: Application ports are segregated by capability and include repositories, IUnitOfWork, ICatalogCache, IIdGenerator, ICurrentPrincipal, the outbox dispatcher, and telemetry abstractions so handlers depend only on the interfaces they use.
  source: brief
  brief-rows:
  - 1
  delivered-by:
  - WP1.7
  - WP1.8
  - WP1.9
  verification:
  - architecture
  - unit
  evidence: port definitions and handler unit tests
  status: planned
- id: REQ-ARC-004
  title: Endpoints depend on contracts and handler interfaces only
  statement: HTTP endpoints depend only on request and response contracts plus the specific handler interfaces they call, and never on domain entities or infrastructure types.
  source: plan
  delivered-by:
  - WP1.7
  - WP1.10
  verification:
  - architecture
  - integration
  evidence: endpoint dependency rules and API tests
  status: planned
- id: REQ-ARC-005
  title: Handlers are sealed and state is not global
  statement: Command and query handlers are internal sealed types, and the solution forbids static mutable state outside the composition root.
  source: plan
  delivered-by:
  - WP1.1
  - WP1.7
  verification:
  - architecture
  evidence: ArchUnitNET naming and state rules
  status: planned
