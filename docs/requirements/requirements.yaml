- id: REQ-API-001
  title: v1 endpoints expose products and categories
  statement: The v1 API exposes /api/v1/categories, /api/v1/categories/{id}, /api/v1/products, /api/v1/products/{id}, and POST discontinue actions, and product listing supports categoryId, status, q, sort, pageSize of at most 100, and cursor.
