- id: REQ-DATA-001
  title: The catalog schema uses concurrency tokens and keyset indexes
  statement: The catalog schema contains Products, Categories, OutboxMessages, OutboxReceipts, IdempotencyRecords, and EF migrations history in the catalog schema, uses rowversion concurrency tokens, keeps a filtered unique index on normalized SKU, and includes the keyset indexes and decimal precision from section 8.4.
  source: brief
  brief-rows:
  - 4
  delivered-by:
  - WP1.8
  verification:
  - integration
  - architecture
  evidence: migration snapshot and EF mapping tests
  status: planned
- id: REQ-DATA-002
  title: Each unit of work commits data and outbox rows together
  statement: IUnitOfWork wraps one DbContext transaction, and a SaveChangesInterceptor writes recorded domain events into outbox rows inside the same commit.
  source: brief
  brief-rows:
  - 4
  delivered-by:
  - WP1.8
  verification:
  - integration
  evidence: transactional outbox tests
  status: planned
- id: REQ-DATA-003
  title: The outbox delivers at least once and records receipts
  statement: The outbox processor delivers messages at least once, leases work with READPAST, UPDLOCK, and ROWLOCK semantics, retries with exponential backoff and jitter, moves exhausted work to dead-letter state, and records a receipt for each idempotent handler execution.
  source: plan
  delivered-by:
  - WP1.8
  - WP4.4
  verification:
  - integration
  - e2e
  evidence: outbox processor tests and rollout evidence
  status: planned
- id: REQ-DATA-004
  title: Idempotency records persist request fingerprints for 24 hours
  statement: Each idempotency record stores the key, caller sub or azp, request hash, status, and response snapshot in the same transaction as the command effect and expires after 24 hours.
  source: plan
  delivered-by:
  - WP1.8
  - WP1.10
  verification:
  - integration
  evidence: IdempotencyRecords tests
  status: planned
- id: REQ-DATA-005
  title: Database connections rotate credentials without disabling pooling
  statement: An IDbConnectionInterceptor reads credentials from a cached ICredentialSource on ConnectionOpeningAsync, keeps pooling enabled, and clears pools keyed by the old credential after a grace period when rotation occurs.
  source: plan
  delivered-by:
  - WP1.0
  - WP1.8
  - WP3.3
  - WP3.4
  verification:
  - integration
  - e2e
  evidence: credential rotation transcript
  status: planned
