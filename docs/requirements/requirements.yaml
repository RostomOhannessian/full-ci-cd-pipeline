- id: REQ-API-002
  title: Responses advertise API versions and deprecation
  statement: Versioned responses send api-supported-versions and use the Deprecation header from RFC 9745 plus the Sunset header from RFC 8594 when a version enters its documented support window.
  source: plan
  delivered-by:
  - WP1.5
  - WP4.1
  verification:
  - contract
  - integration
  evidence: header assertions and API versioning tests
  status: planned
- id: REQ-API-003
  title: Conditional requests enforce strong ETags
  statement: GET supports If-None-Match with 304, and update or discontinue operations require If-Match so a missing header returns 428 and a stale header returns 412.
  source: plan
  delivered-by:
  - WP1.5
  - WP1.10
  verification:
  - integration
  - contract
  evidence: 412, 428, and 304 API cases
  status: planned
- id: REQ-API-004
  title: POST creates require an Idempotency-Key
  statement: Product-creation POST requests require an Idempotency-Key header, and reusing a key with a different payload returns 422 while concurrent use returns 409.
  source: plan
  delivered-by:
  - WP1.5
  - WP1.8
  - WP1.10
  verification:
  - integration
  - contract
  evidence: idempotency replay and conflict cases
  status: planned
- id: REQ-API-005
  title: Errors use RFC 9457 Problem Details
