- id: REQ-GOV-003
  title: The resume protocol works from a fresh clone on another machine
  statement: A fresh clone can resume work by reading STATUS.md, checking out the active branch, running dev doctor, and continuing with the next action, and the end-of-session protocol updates status, regenerates STATUS.md, commits, and keeps the draft pull request current.
  source: planning-request
  brief-rows:
  - 34
  delivered-by:
