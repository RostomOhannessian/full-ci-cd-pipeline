- id: REQ-CACHE-001
  title: Catalog caching uses FusionCache over L1 L2 and a backplane
  statement: Catalog caching uses FusionCache behind ICatalogCache with an IMemoryCache L1, an IDistributedCache L2 backed by Valkey through StackExchange.Redis, and a Valkey pub-sub backplane scoped by environment prefix.
  source: brief
  brief-rows:
  - 5
  delivered-by:
  - WP1.9
  verification:
  - integration
  - architecture
  evidence: two-host cache tests
  status: planned
- id: REQ-CACHE-002
  title: Writes invalidate product and list caches deterministically
  statement: After a successful write, the writing node synchronously removes affected keys and tags, awaits L2 removal, publishes backplane invalidation, repeats the invalidation through the outbox, guarantees read-your-own-write behavior, and bounds other-reader staleness to the backplane latency or the default 30-second L1 TTL.
  source: plan
  delivered-by:
  - WP1.9
  - WP4.4
  verification:
  - integration
  - e2e
  evidence: cross-node invalidation tests
  status: planned
- id: REQ-CACHE-003
  title: Cache degradation keeps readiness green and reports stale risk
  statement: If Valkey is unavailable, caching degrades behind a circuit breaker to L1 plus the database while readiness stays green, and if the backplane is unavailable the system widens staleness to the L1 TTL and reports that condition through metrics and alerts.
  source: brief
  brief-rows:
  - 5
  delivered-by:
  - WP1.9
  - WP1.11
  - WP4.4
  verification:
  - integration
  - performance
  evidence: Valkey-down chaos test and cache metrics
  status: planned
