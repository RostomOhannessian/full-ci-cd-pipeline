  - WP0.5
  - WP0.7
  - WP1.2
  verification:
  - manual
  - docs
  evidence: fresh-clone resume transcript
  status: in_progress
  notes: The status page is generated and a fresh clone resumes from it (see the evidence record). The dev doctor step arrives with WP1.4, and until then the resume protocol uses the quality-gate commands in AGENTS.md.
