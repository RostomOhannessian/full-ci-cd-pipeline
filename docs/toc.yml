# The top navigation of the site. Each entry opens the index page of one section, and the Diataxis sections come first (plan section 11.1).
# The API reference is generated into .docfx/api by the metadata stage and published under reference/api. DocFX resolves a navigation entry
# against the source files, so the entry names the generated table of contents by its path. It needs a public type, and a build that did not
# run the metadata stage first fails here, because the file is not there (WP1.6 added the first public types).
