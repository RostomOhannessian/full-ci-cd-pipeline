# The evidence register: proof that a requirement holds when the proof is not an automated test. Automated tests prove a requirement by
# carrying its ID, so they need no entry here. Each entry names a file that must exist. `governance trace` reads this file, checks every
# path, and renders docs/testing/traceability.md. The schema is evidence.schema.json, and ADR-0022 explains the rules.
schema-version: 1
last-verified: '2026-11-02'
entries:
  - requirements: [REQ-GOV-001]
    kind: docs
    path: docs/plans/implementation-plan.md
    summary: The implementation plan and its phase plans are repository files with a revision history, so planning does not depend on a session or a machine.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-001]
    kind: docs
    path: docs/project/status.yaml
    summary: The status source of truth holds the phase and work-package state, the evidence links, and the resume data, and CI validates it on every pull request.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-001]
    kind: docs
    path: docs/project/risk-register.md
    summary: The live risk register, with mitigations and revisit triggers, is a repository file that each phase retrospective reviews.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-001]
    kind: docs
    path: docs/requirements/requirements.yaml
    summary: The requirements register, with the work packages that deliver each requirement, is a repository file, and the generated traceability report is built from it.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-001]
    kind: docs
    path: docs/journal/phase-0-retrospective.md
    summary: The Phase 0 retrospective records what was built, what went wrong, and what changed, as the plan asks of every phase.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-003]
    kind: manual
    path: docs/testing/evidence/2026-10-08-fresh-clone-resume.md
    summary: A fresh clone of the WP1.2 branch, in a new directory, restored, built, validated its status files, and passed the four documentation gates by following STATUS.md. The record notes that dev doctor does not exist yet.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-007]
    kind: policy
    path: docs/governance/github-settings.md
    summary: The settings record lists the two rulesets, the code owner review, the solo-maintainer bypass, and the evidence that each was applied, with the required checks that are not applied yet.
    recorded: '2026-10-08'
  - requirements: [REQ-GOV-007]
    kind: policy
    path: .github/CODEOWNERS
    summary: Sensitive paths require code owner review, and a test checks that the blast-radius map asks for that review for every path in the file.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-001]
    kind: docs
    path: AGENTS.md
    summary: The agent entry point carries the mission, the doctrine, the branch protocol, the prohibited actions, and the status-update protocol.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-001]
    kind: docs
    path: .github/copilot-instructions.md
    summary: The repository-wide Copilot instructions travel with the code and carry the rules that code review applies.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-001]
    kind: docs
    path: .github/instructions/
    summary: Path-scoped instruction files cover C#, tests, documentation, workflows, Terraform, Kubernetes, and policy files.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-001]
    kind: docs
    path: REVIEW.md
    summary: The review checklist that AI and human reviewers apply is a repository file with severities and a list of what not to flag.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-003]
    kind: docs
    path: docs/research/2026-10-04-external-skill-review.md
    summary: The review record covers twelve external skill candidates, each with its publisher, license signal, pinned commit, and recommendation, and none is installed.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-003]
    kind: docs
    path: docs/governance/ai-skills.md
    summary: The six-step external skill review, the approval rule, and the review results are written down, and the repository installs no external skill.
    recorded: '2026-10-08'
  - requirements: [REQ-AI-005]
    kind: docs
    path: docs/project/AI-USAGE.md
    summary: The generated report shows what each phase and each completed work package cost in AI units, with the model, the effort, the peak context, and the size of the change, and the observed AIU of each size class that the estimate is built from. CI fails when the page differs from what the ledger renders.
    recorded: '2026-10-12'
  - requirements: [REQ-DX-001, REQ-DX-002, REQ-DX-005, REQ-IDN-001, REQ-GOV-003]
    kind: manual
    path: docs/testing/evidence/2026-10-10-dev-container-quick-start.md
    summary: A fresh clone built the Dev Container with a frozen lock file, ran dev bootstrap and dev doctor on creation, then built the solution, ran the unit tests, and ran Lab 1 against the API-only stack inside it. The record also holds the native Windows run and the role-matrix check.
    recorded: '2026-10-10'
  - requirements: [REQ-DX-002]
    kind: docs
    path: docs/tutorials/native-setup.md
    summary: The native setup guide lists the three prerequisites (Git, Docker, and the .NET SDK), the install steps for Windows, Linux, and macOS, and the doctor output that proves them, and it notes that the macOS path is untested.
    recorded: '2026-10-10'
  - requirements: [REQ-DX-005]
    kind: docs
    path: docs/runbooks/machine-migration.md
    summary: The machine-migration runbook moves work to a new machine without copying secrets or state, and records the rehearsal with its limits.
    recorded: '2026-10-10'
  - requirements: [REQ-DX-005]
    kind: docs
    path: docs/reference/host-support.md
    summary: The host support matrix names the supported hosts, the resource budgets of the profiles, and the ports that the stack uses, all of them above 1024 and bound to the loopback interface.
    recorded: '2026-10-10'
  - requirements: [REQ-IDN-005]
    kind: docs
    path: identity/keycloak/realms/catalog-realm.json
    summary: The catalog realm is one file with environment placeholders, and the Compose stack imports it. The Pester realm tests check the placeholders, and the Testcontainers import arrives in WP1.10.
    recorded: '2026-10-10'
  - requirements: [REQ-CON-001, REQ-API-001]
    kind: contract
    path: contracts/openapi/catalog/v1/catalog.openapi.yaml
    summary: The authored OpenAPI 3.1 contract defines the 10 operations, the schemas, Problem Details, the headers, the three scopes, and a valid example for every body, and Spectral and the contract tests hold it.
    recorded: '2026-10-11'
  - requirements: [REQ-API-001, REQ-CON-001]
    kind: docs
    path: docs/reference/api-contract.md
    summary: The API contract page lists the operations, the permission matrix, the headers, and the rules for conditional requests, idempotent creates, and pages, and a test compares its matrix with the contract.
    recorded: '2026-10-11'
  - requirements: [REQ-API-005]
    kind: docs
    path: docs/reference/error-catalog.md
    summary: The error catalog describes the 17 error types of the API with their status, title, cause, and remedy, and a test fails when its entries and the examples of the contract disagree.
    recorded: '2026-10-11'
  - requirements: [REQ-API-002, REQ-API-004]
    kind: docs
    path: docs/reference/api-style-guide.md
    summary: The API style guide sets the versioning and deprecation rules with a 180-day support window and the format of the idempotency key, and tests check the window against the decision record.
    recorded: '2026-10-11'
  - requirements: [REQ-QUA-006]
    kind: manual
    path: docs/testing/evidence/2026-10-12-domain-mutation-baseline.md
    summary: Stryker.NET mutated the domain model in the pinned Linux SDK image and scored its 172 tests at 94.62 percent, with 211 mutants killed and 12 survivors that are classified as 7 equivalent and 5 in static initializers. Removing the Product tests lowered the score to 81.61 percent, which shows that the report finds weak tests.
    recorded: '2026-10-12'
  - requirements: [REQ-QUA-005]
    kind: policy
    path: governance/policies/coverage-thresholds.json
    summary: The threshold gate in the ci workflow, tools/ci/Test-CoverageThresholds.ps1, reads these thresholds and fails the build under 90 percent of lines or 80 percent of branches for the Domain, under 85 percent of lines or 80 percent of branches for the Application, or under 80 percent of lines for the solution. The run of 2026-11-01 measured 99.63 and 98.41 for the Domain, 100 and 99.52 for the Application, and 99.88 percent of the lines of the solution.
    recorded: '2026-11-01'
  - requirements: [REQ-QUA-006]
    kind: manual
    path: docs/testing/evidence/2026-11-01-application-mutation-baseline.md
    summary: Stryker.NET mutated the application layer in the pinned Linux SDK image and scored its 192 tests at 96.92 percent, with 252 mutants killed and 8 survivors that are all equivalent. The first run scored 90.00 percent, and 12 new tests killed the 18 survivors that showed a weak edge.
    recorded: '2026-11-01'
  - requirements: [REQ-DOM-004]
    kind: docs
    path: docs/reference/domain-model.md
    summary: The domain model page lists the eight events with their properties, the error codes, the rules, and the lifecycle, and a test parses the page and fails when it disagrees with the events and the error codes of the model.
    recorded: '2026-10-12'
  - requirements: [REQ-APP-002, REQ-APP-003]
    kind: docs
    path: docs/adr/0032-decorator-pipeline-and-application-results.md
    summary: ADR-0032 records the outermost-first order of the command and the query decorators and the reason for each position, and the tests of PipelineOrderTests run the production chains and assert the same order.
    recorded: '2026-11-01'
  - requirements: [REQ-QUA-001]
    kind: manual
    path: docs/testing/evidence/2026-11-02-persistence-linux-run.md
    summary: The persistence suites ran against a real SQL Server 2022 container that an assembly fixture starts from the digest of compose.yaml, on Windows with Docker Desktop and in the pinned Linux SDK image with the Docker socket mounted. All 1,488 tests passed on both hosts, and the coverage thresholds passed on Linux.
    recorded: '2026-11-02'
  - requirements: [REQ-DATA-006]
    kind: manual
    path: docs/runbooks/database-migration.md
    summary: The runbook builds the idempotent script and the migration bundle, and its rehearsal applied InitialCreate with the bundle to a throwaway SQL Server 2022 container, applied nothing on a second run, and found the six tables of the schema. A second rehearsal applied the idempotent script of both migrations twice with sqlcmd -I.
    recorded: '2026-11-02'
  - requirements: [REQ-DATA-002, REQ-DATA-003, REQ-DATA-004, REQ-DOM-004]
    kind: manual
    path: docs/testing/evidence/2026-11-02-outbox-idempotency-run.md
    summary: The outbox and idempotency suites ran against a real SQL Server 2022 container on Windows with Docker Desktop and in the pinned Linux SDK image with the Docker socket mounted. All 1,596 tests passed on both hosts, the coverage thresholds passed, no test sleeps, and the record lists what each class proves, including the stop after delivery, the death of a processor, the fence, concurrent processors, and eight concurrent idempotency requests.
    recorded: '2026-11-02'
  - requirements: [REQ-DATA-003, REQ-DATA-004]
    kind: docs
    path: docs/adr/0035-outbox-processor-design.md
    summary: ADR-0035 records the lease, the fence, the receipts, the retries and the dead-letter state, the wake-up, the cleanup, and the payload contract of the outbox, and ADR-0036 records the reservation, the replay, the takeover, and the exact comparison of the idempotency store.
    recorded: '2026-11-02'
  - requirements: [REQ-DATA-005]
    kind: manual
    path: docs/testing/evidence/2026-11-02-credential-rotation-run.md
    summary: The credential suites ran against a real SQL Server 2022 container in the pinned Linux SDK image with the Docker socket mounted. New connections switch to the new login while the pool is reused, the old login has no session after the grace period, work in flight finishes, the old login can be revoked, and no secret reaches a log, a message, or a data bag. The Windows host blocked the freshly built test assembly, and the record says so.
    recorded: '2026-11-02'
  - requirements: [REQ-DATA-005]
    kind: docs
    path: docs/adr/0037-credential-rotation-and-pool-clearing.md
    summary: ADR-0037 records the cached source, the interceptor, the single connection string function, the janitor and the order rotate, switch, clear, revoke, the handling of a bad file, and the rule that no credential value reaches any text.
    recorded: '2026-11-02'
