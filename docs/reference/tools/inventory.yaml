  # Data stores
  - id: sql-server
    name: Microsoft SQL Server
    category: data-store
    tier: A
    lifecycle: adopt
    usage: planned
    introduced: phase-1
    purpose: Stores the catalog, Keycloak, idempotency, and outbox data used by the sample system.
    license: proprietary, free developer edition for non-production use
    license-source: https://www.microsoft.com/en-us/sql-server/sql-server-downloads
    version: "2022"
    sources:
      - https://www.microsoft.com/en-us/sql-server/sql-server-downloads
      - https://learn.microsoft.com/en-us/sql/linux/containers/deploy
      - https://go.microsoft.com/fwlink/?linkid=866658
    adrs: ["0012", "0018", "0019"]
    notes: The project uses SQL Server 2022 container images for teaching and testing and pins the exact digest at implementation time. Spike 1.d (2026-10-06) used the 2022-latest image at digest sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090 (server 16.0.4295.3, Developer Edition, amd64). Microsoft documents SQL Server container images as supported only on x86-64 Linux hosts, with Rosetta 2, Prism, and QEMU not tested or supported (checked 2026-10-06). Measure memory from the container cgroup, because SQL Server's own memory views overstate it inside a container.
  - id: valkey
    name: Valkey
    category: data-store
    tier: A
    lifecycle: adopt
    usage: planned
    introduced: phase-1
    purpose: Supplies the distributed cache, backplane, and selected ephemeral coordination data.
    license: BSD-3-Clause
    license-source: https://github.com/valkey-io/valkey
    version: "9.1.2"
    repo: https://github.com/valkey-io/valkey
    sources:
      - https://github.com/valkey-io/valkey
      - https://github.com/valkey-io/valkey/releases/tag/9.1.2
      - https://valkey.io/download/
    adrs: ["0016"]
    notes: Spike 1.b (2026-10-06) ran the same two-host cache tests against the 8.1 and 9.1 lines (servers 8.1.10 and 9.1.2, amd64) with identical results, so either line works as the L2 and backplane. The Testcontainers .NET project has no Valkey module, so tests use its Redis builder with a pinned Valkey image.

