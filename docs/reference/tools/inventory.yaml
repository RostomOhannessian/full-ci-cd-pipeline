    notes: The core SDK and the ASP.NET Core and SqlClient instrumentations are stable. The EF Core (1.19.1-beta.1) and StackExchange.Redis (1.19.0-beta.1) instrumentation packages have never had a stable release, so pin them exactly and review them on every upgrade.
  - id: sqlclient
    name: Microsoft.Data.SqlClient
    category: dotnet-library
    tier: C
    lifecycle: adopt
    usage: planned
    introduced: phase-1
    purpose: Connects the API, migrator, and tests to SQL Server.
    license: MIT
    license-source: https://www.nuget.org/packages/Microsoft.Data.SqlClient/7.1.1/license
    version: "7.1.1"
    sources:
      - https://www.nuget.org/packages/Microsoft.Data.SqlClient
      - https://aka.ms/sqlclientproject
    adrs: ["0018"]
    notes: Spikes 1.d and 1.e (2026-10-06) ran 7.1.1 with EF Core 10.0.12 without warnings. A connection interceptor can set the connection string with a rotated credential before each open while pooling stays on, and SqlConnection.ClearPool on a connection built from the old credential's string clears the old pool. The pool key is the full connection string, so build the string with one shared helper. The loaded assembly reports version 7.0.0.0 for package 7.1.1.

